<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحقق أمني</title>
  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    #turnstile-container {
      max-width: 100%;
      min-height: 65px;
    }
  </style>
</head>
<body>
  <div id="turnstile-container"></div>
  <script>
    const allowedDashboardHost = (hostname) =>
      hostname === "index-dashboard-1yf.pages.dev" ||
      hostname.endsWith(".index-dashboard-1yf.pages.dev") ||
      hostname === "index-dashboard.pages.dev" ||
      hostname.endsWith(".index-dashboard.pages.dev") ||
      hostname === "apex-index.github.io" ||
      hostname === "localhost" ||
      hostname === "127.0.0.1";

    const siteKey = "0x4AAAAAAEJp1NPibtOC8ok_";
    const statusPrefix = "index-turnstile:";
    const maxAutomaticRetries = 2;

    let widgetId = null;
    let retryCount = 0;
    let scriptReady = false;
    let scriptTimeoutId = null;

    function normalizeAllowedParentOrigin(value) {
      if (!value) return null;

      try {
        const parentUrl = new URL(value);
        const isLocalHost =
          parentUrl.hostname === "localhost" ||
          parentUrl.hostname === "127.0.0.1";

        if (parentUrl.username || parentUrl.password) return null;
        if (!allowedDashboardHost(parentUrl.hostname)) return null;
        if (parentUrl.protocol !== "https:" &&
            !(isLocalHost && parentUrl.protocol === "http:")) {
          return null;
        }

        return parentUrl.origin;
      } catch (_) {
        return null;
      }
    }

    function getAllowedParentOrigin() {
      if (window.parent === window) return null;

      // Prefer the explicit origin supplied by the dashboard. This avoids
      // depending on document.referrer, which privacy settings may omit.
      const configuredOrigin =
        new URLSearchParams(window.location.search).get("parentOrigin");
      const allowedConfiguredOrigin =
        normalizeAllowedParentOrigin(configuredOrigin);
      if (allowedConfiguredOrigin) return allowedConfiguredOrigin;

      // Keep compatibility with existing native/web integrations.
      return normalizeAllowedParentOrigin(document.referrer);
    }

    function notifyParentStatus(status) {
      const parentOrigin = getAllowedParentOrigin();
      if (!parentOrigin) return;
      window.parent.postMessage(statusPrefix + status, parentOrigin);
    }

    function notifyHost(token) {
      // When embedded, the verified token belongs to the iframe host. Always
      // deliver it there first, even if a native bridge is also injected into
      // the frame. Otherwise the parent could receive "verified" status but
      // never receive the token required by Supabase Auth.
      const parentOrigin = getAllowedParentOrigin();
      if (parentOrigin) {
        window.parent.postMessage(token || "", parentOrigin);
        return true;
      }

      // Preserve the existing Android/iOS bridge for top-level WebViews.
      if (window.TurnstileChannel &&
          typeof window.TurnstileChannel.postMessage === "function") {
        window.TurnstileChannel.postMessage(token || "");
        return true;
      }

      return false;
    }

    function onSuccess(token) {
      retryCount = 0;
      if (!notifyHost(token)) return;
      notifyParentStatus("verified");
    }

    function onExpired() {
      notifyHost("");
      notifyParentStatus("expired");
    }

    function onTimeout() {
      notifyHost("");
      notifyParentStatus("timeout");
    }

    function onError(errorCode) {
      notifyHost("");

      // Keep the established native WebView behavior unchanged. Bounded
      // retries and status reporting are for the Dashboard iframe only.
      if (!getAllowedParentOrigin()) return false;

      retryCount += 1;
      const code = String(errorCode || "unknown");
      if (retryCount <= maxAutomaticRetries) {
        notifyParentStatus("retrying:" + code);
        // Let Turnstile perform its built-in retry for transient failures.
        return false;
      }

      // Stop endless automatic retries and let the visitor retry explicitly.
      notifyParentStatus("error:" + code);
      return true;
    }

    function renderTurnstile() {
      if (!window.turnstile) {
        notifyParentStatus("error:api-unavailable");
        return;
      }

      try {
        widgetId = window.turnstile.render("#turnstile-container", {
          sitekey: siteKey,
          retry: "auto",
          "retry-interval": 8000,
          callback: onSuccess,
          "expired-callback": onExpired,
          "timeout-callback": onTimeout,
          "error-callback": onError,
        });
        notifyParentStatus("ready");
      } catch (_) {
        notifyParentStatus("error:render-failed");
      }
    }

    window.onIndexTurnstileLoad = function () {
      scriptReady = true;
      if (scriptTimeoutId !== null) {
        window.clearTimeout(scriptTimeoutId);
        scriptTimeoutId = null;
      }
      renderTurnstile();
    };

    function onScriptError() {
      if (scriptTimeoutId !== null) {
        window.clearTimeout(scriptTimeoutId);
        scriptTimeoutId = null;
      }
      notifyParentStatus("error:script-load");
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;

      const parentOrigin = getAllowedParentOrigin();
      if (!parentOrigin || event.origin !== parentOrigin) return;
      if (event.data !== "index-turnstile-reset") return;

      notifyHost("");
      retryCount = 0;

      if (window.turnstile && widgetId !== null) {
        try {
          window.turnstile.reset(widgetId);
          notifyParentStatus("ready");
        } catch (_) {
          notifyParentStatus("error:reset-failed");
        }
        return;
      }

      // The API script failed to load; a fresh document load is required.
      window.location.reload();
    });

    notifyParentStatus("loading");

    scriptTimeoutId = window.setTimeout(() => {
      if (!scriptReady) onScriptError();
    }, 15000);

    const script = document.createElement("script");
    script.src =
      "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onIndexTurnstileLoad";
    script.async = true;
    script.defer = true;
    script.onerror = onScriptError;
    document.head.appendChild(script);
  </script>
</body>
</html>
